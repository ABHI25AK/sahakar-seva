<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Registration — SahakarSeva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/auth.js"></script>
<style>
  .auth-error-box {
    display: none;
    background: #FFECEC;
    color: #C53030;
    border: 1px solid #FEB2B2;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active {
    display: flex;
  }
  .register-card {
    background: #ffffff;
    color: #081B1E;
    width: 100%;
    max-width: 440px;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    position: relative;
  }
  .close-modal {
    position: absolute;
    top: 16px;
    right: 18px;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    color: #565F6B;
  }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="logo" style="justify-content:center; margin-bottom:8px;">
      <img src="assets/images/logo.png" alt="SahakarSeva Logo" class="logo-img" style="width:42px; height:42px;"> Sahakar<span class="accent">Seva</span>
    </a>
    <div class="auth-sub">Log in to continue to your cooperative account</div>

    <div class="role-tabs" id="roleTabs">
      <button class="role-tab" data-role="customer">Customer</button>
      <button class="role-tab" data-role="worker">Worker</button>
      <button class="role-tab" data-role="admin">Federation Admin</button>
    </div>

    <!-- Error Box -->
    <div class="auth-error-box" id="authError"></div>

    <!-- Customer Form (2 Fields: Email & Password) -->
    <form class="auth-role-panel" data-panel="customer" onsubmit="return ssHandleLogin(event, 'customer')">
      <div class="form-group">
        <label>Email Address</label>
        <input class="form-input" id="custEmail" type="email" placeholder="rajesh.sharma@gmail.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-input" id="custPass" type="password" placeholder="••••••••" required>
      </div>
      <div class="auth-meta-row">
        <label style="display:flex; align-items:center; gap:6px;">
          <input type="checkbox" checked> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-customer btn-block">Log In as Customer</button>
    </form>

    <!-- Worker Form (2 Fields: Email & Password) -->
    <form class="auth-role-panel" data-panel="worker" onsubmit="return ssHandleLogin(event, 'worker')">
      <div class="form-group">
        <label>Cooperative Worker Email</label>
        <input class="form-input" id="workEmail" type="email" placeholder="ramesh.kumar@gmail.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-input" id="workPass" type="password" placeholder="••••••••" required>
      </div>
      <div class="auth-meta-row">
        <label style="display:flex; align-items:center; gap:6px;">
          <input type="checkbox" checked> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-worker btn-block">Log In as Worker</button>
    </form>

    <!-- Federation Admin Form (2 Fields: Email & Password) -->
    <form class="auth-role-panel" data-panel="admin" onsubmit="return ssHandleLogin(event, 'admin')">
      <div class="form-group">
        <label>Registrar Official Email</label>
        <input class="form-input" id="adminEmail" type="email" placeholder="sk.kadam@sahakarseva.gov.in" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-input" id="adminPass" type="password" placeholder="••••••••" required>
      </div>
      <div class="auth-meta-row">
        <span>Audited by Ministry of Cooperation.</span>
      </div>
      <button type="submit" class="btn btn-admin btn-block">Log In to Federation Panel</button>
    </form>

    <!-- Registration Link -->
    <div class="auth-footer-note">
      Don't have an account? <a href="#" id="openRegisterBtn" onclick="openRegisterModal(event)">Create New Account</a>
    </div>
  </div>
</div>

<!-- SEPARATE REGISTRATION MODAL / SECTION -->
<div class="modal-overlay" id="registerModal">
  <div class="register-card">
    <span class="close-modal" onclick="closeRegisterModal()">&times;</span>
    <div style="text-align:center; margin-bottom:18px;">
      <h3 style="font-size:20px; font-weight:800; color:#028090; margin-bottom:4px;">Create New Account</h3>
      <p style="font-size:12.5px; color:#565F6B;">Register into SahakarSeva Database</p>
    </div>

    <div class="auth-error-box" id="regError" style="margin-bottom:12px;"></div>

    <form onsubmit="return handleRegisterSubmit(event)">
      <div class="form-group">
        <label style="color:#081B1E;">Full Name</label>
        <input class="form-input" type="text" id="regName" placeholder="e.g. Vikramaditya Singh" style="border:1px solid #DCE8E9; color:#081B1E;" required>
      </div>
      <div class="form-group">
        <label style="color:#081B1E;">Email Address (valid gmail / email)</label>
        <input class="form-input" type="email" id="regEmail" placeholder="vikram@gmail.com" style="border:1px solid #DCE8E9; color:#081B1E;" required>
      </div>
      <div class="form-group">
        <label style="color:#081B1E;">Account Role</label>
        <select class="form-input" id="regRole" style="border:1px solid #DCE8E9; color:#081B1E;" required>
          <option value="customer">Customer</option>
          <option value="worker">Cooperative Worker</option>
          <option value="admin">Federation Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label style="color:#081B1E;">Password</label>
        <input class="form-input" type="password" id="regPass" placeholder="••••••••" style="border:1px solid #DCE8E9; color:#081B1E;" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">Register &amp; Save to Database</button>
    </form>

    <div style="text-align:center; margin-top:14px; font-size:12.5px; color:#565F6B;">
      Already registered? <a href="#" onclick="closeRegisterModal()" style="color:#028090; font-weight:700;">Log In Here</a>
    </div>
  </div>
</div>

<script>
  const roleTabs = document.querySelectorAll('.role-tab');
  const panels = document.querySelectorAll('.auth-role-panel');
  const authCard = document.querySelector('.auth-card');
  const authPage = document.querySelector('.auth-page');
  const authError = document.getElementById('authError');
  const regError = document.getElementById('regError');

  function hideErrors() {
    if (authError) authError.style.display = 'none';
    if (regError) regError.style.display = 'none';
  }

  function setActiveRole(role) {
    hideErrors();
    if (authCard) authCard.setAttribute('data-theme', role);
    if (authPage) authPage.setAttribute('data-theme', role);
    roleTabs.forEach(t => t.classList.toggle('active', t.dataset.role === role));
    panels.forEach(p => p.classList.toggle('active', p.dataset.panel === role));
  }

  roleTabs.forEach(tab => {
    tab.addEventListener('click', () => setActiveRole(tab.dataset.role));
  });

  const params = new URLSearchParams(window.location.search);
  const requested = params.get('role');
  setActiveRole(['customer', 'worker', 'admin'].includes(requested) ? requested : 'customer');

  function ssHandleLogin(evt, role) {
    evt.preventDefault();
    hideErrors();

    const form = evt.target;
    const emailInput = form.querySelector('input[type="email"]');
    const passInput = form.querySelector('input[type="password"]');

    const email = emailInput ? emailInput.value.trim() : '';
    const pass = passInput ? passInput.value.trim() : '';

    const res = ssAuthenticateUser(role, email, pass);

    if (res.success) {
      window.location.href = SS_DESTINATIONS[role];
    } else {
      authError.textContent = res.error;
      authError.style.display = 'block';
    }

    return false;
  }

  function openRegisterModal(e) {
    if (e) e.preventDefault();
    hideErrors();
    document.getElementById('registerModal').classList.add('active');
  }

  function closeRegisterModal() {
    hideErrors();
    document.getElementById('registerModal').classList.remove('active');
  }

  function handleRegisterSubmit(e) {
    e.preventDefault();
    hideErrors();

    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const role = document.getElementById('regRole').value;
    const pass = document.getElementById('regPass').value;

    const res = ssRegisterUser(name, email, role, pass);

    if (res.success) {
      window.location.href = SS_DESTINATIONS[role];
    } else {
      regError.textContent = res.error;
      regError.style.display = 'block';
    }

    return false;
  }
</script>
</body>
</html>
